version: 2

models:
  # ─────────────────────────────────────────────
  # fact_contract  →  dim_player, dim_team,
  #                   dim_season, dim_position (x2)
  # ─────────────────────────────────────────────
  - name: fact_contract
    columns:
      - name: contract_sk
        constraints:
          - type: primary_key
            enforced: true
        data_tests:
          - unique
          - not_null

      - name: player_sk
        constraints:
          - type: foreign_key
            to: ref('dim_player')
            to_columns: ['player_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_sk

      - name: team_sk
        constraints:
          - type: foreign_key
            to: ref('dim_team')
            to_columns: ['team_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk

      - name: season_sk
        constraints:
          - type: foreign_key
            to: ref('dim_season')
            to_columns: ['season_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_season')
              field: season_sk

      # fix: main_position_sk and second_position_sk were missing
      #      from original facts schema — both visible in diagram
      - name: main_position_sk
        constraints:
          - type: foreign_key
            to: ref('dim_position')
            to_columns: ['position_sk']
            enforced: true
        data_tests:
          - relationships:
              to: ref('dim_position')
              field: position_sk

      - name: second_position_sk
        constraints:
          - type: foreign_key
            to: ref('dim_position')
            to_columns: ['position_sk']
            enforced: true
        data_tests:
          - relationships:
              to: ref('dim_position')
              field: position_sk
              where: second_position_sk is not null

  # ─────────────────────────────────────────────
  # fact_match  →  dim_date, dim_league,
  #                dim_season, dim_team (x2),
  #                dim_formation (x2),
  #                dim_unique_player (captain)
  # ─────────────────────────────────────────────
  - name: fact_match
    columns:
      - name: match_sk
        constraints:
          - type: primary_key
            enforced: true
        data_tests:
          - unique
          - not_null

      - name: date_sk
        constraints:
          - type: foreign_key
            to: ref('dim_date')
            to_columns: ['date_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk

      - name: league_sk
        constraints:
          - type: foreign_key
            to: ref('dim_league')
            to_columns: ['league_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk

      - name: season_sk
        constraints:
          - type: foreign_key
            to: ref('dim_season')
            to_columns: ['season_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_season')
              field: season_sk

      - name: team_sk
        constraints:
          - type: foreign_key
            to: ref('dim_team')
            to_columns: ['team_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk

      - name: opponent_sk
        constraints:
          - type: foreign_key
            to: ref('dim_team')
            to_columns: ['team_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk

      - name: formation_sk
        constraints:
          - type: foreign_key
            to: ref('dim_formation')
            to_columns: ['formation_sk']
            enforced: true
        data_tests:
          - relationships:
              to: ref('dim_formation')
              field: formation_sk
              where: formation_sk is not null

      - name: opp_formation_sk
        constraints:
          - type: foreign_key
            to: ref('dim_formation')
            to_columns: ['formation_sk']
            enforced: true
        data_tests:
          - relationships:
              to: ref('dim_formation')
              field: formation_sk
              where: opp_formation_sk is not null

      # fix: column name corrected to captain_player_sk (matches diagram)
      # fix: relationship field corrected to unique_player_sk (was player_sk)
      - name: captain_player_sk
        constraints:
          - type: foreign_key
            to: ref('dim_unique_player')
            to_columns: ['unique_player_sk']
            enforced: true
        data_tests:
          - relationships:
              to: ref('dim_unique_player')
              field: unique_player_sk
              where: captain_player_sk is not null

  # ─────────────────────────────────────────────
  # fact_standing  →  dim_league, dim_season,
  #                   dim_team,
  #                   dim_unique_player (x2)
  # ─────────────────────────────────────────────
  - name: fact_standing
    columns:
      - name: standings_sk
        constraints:
          - type: primary_key
            enforced: true
        data_tests:
          - unique
          - not_null

      - name: league_sk
        constraints:
          - type: foreign_key
            to: ref('dim_league')
            to_columns: ['league_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk

      - name: season_sk
        constraints:
          - type: foreign_key
            to: ref('dim_season')
            to_columns: ['season_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_season')
              field: season_sk

      - name: team_sk
        constraints:
          - type: foreign_key
            to: ref('dim_team')
            to_columns: ['team_sk']
            enforced: true
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk

      # fix: column name corrected to top_scorer_player_sk (matches diagram)
      # fix: relationship field corrected to unique_player_sk (was player_sk)
      - name: top_scorer_player_sk
        constraints:
          - type: foreign_key
            to: ref('dim_unique_player')
            to_columns: ['unique_player_sk']
            enforced: true
        data_tests:
          - relationships:
              to: ref('dim_unique_player')
              field: unique_player_sk
              where: top_scorer_player_sk is not null

      # fix: column name corrected to goalkeeper_player_sk (matches diagram)
      # fix: relationship field corrected to unique_player_sk (was player_sk)
      - name: goalkeeper_player_sk
        constraints:
          - type: foreign_key
            to: ref('dim_unique_player')
            to_columns: ['unique_player_sk']
            enforced: true
        data_tests:
          - relationships:
              to: ref('dim_unique_player')
              field: unique_player_sk
              where: goalkeeper_player_sk is not null