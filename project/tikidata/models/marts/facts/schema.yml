version: 2

models:
  - name: fact_contract
    columns:
      - name: player_sk
        data_tests:
          - relationships:
              to: ref('dim_player')
              field: player_sk

      - name: team_sk
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_sk

      - name: season_sk
        data_tests:
          - relationships:
              to: ref('dim_season')
              field: season_sk

      - name: main_position_sk
        data_tests:
          - relationships:
              to: ref('dim_position')
              field: position_sk

      - name: second_position_sk
        data_tests:
          - relationships:
              to: ref('dim_position')
              field: position_sk
              where: second_position_sk is not null

  - name: fact_match
    columns:
      - name: match_sk
        data_tests:
          - unique
          - not_null

      - name: date_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_sk

      - name: league_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk

      - name: season_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_season')
              field: season_sk

      - name: team_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk

      - name: opponent_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk

      - name: formation_sk
        data_tests:
          - relationships:
              to: ref('dim_formation')
              field: formation_sk
              where: formation_sk is not null

      - name: opp_formation_sk
        data_tests:
          - relationships:
              to: ref('dim_formation')
              field: formation_sk
              where: opp_formation_sk is not null

      - name: captain_sk
        data_tests:
          - relationships:
              to: ref('dim_unique_player')
              field: player_sk
              where: captain_sk is not null

  - name: fact_standing
    columns:
      - name: standings_sk
        data_tests:
          - unique
          - not_null

      - name: league_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_league')
              field: league_sk

      - name: season_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_season')
              field: season_sk

      - name: team_sk
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_team')
              field: team_sk

      - name: top_scorer_sk
        data_tests:
          - relationships:
              to: ref('dim_unique_player')
              field: player_sk
              where: top_scorer_sk is not null

      - name: goalkeeper_sk
        data_tests:
          - relationships:
              to: ref('dim_unique_player')
              field: player_sk
              where: goalkeeper_sk is not null